[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supportpulse-analytics"
version = "1.0.0"
description = "Jira support pipeline, SLA breach forecaster and visual reporting engine for enterprise support operations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Vinothkumar N", email = "vinothofficial14@gmail.com" },
]
keywords = ["jira", "support", "sla", "analytics", "visual-management", "reporting"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

dependencies = [
    "pydantic>=2.5",
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "PyYAML>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "streamlit>=1.30",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
supportpulse = "supportpulse.cli:main"

[project.urls]
Homepage = "https://gitlab.com/vinothofficial14/supportpulse-analytics"
Repository = "https://gitlab.com/vinothofficial14/supportpulse-analytics"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
source = ["supportpulse"]
branch = true
omit = ["*/dashboard/app.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
